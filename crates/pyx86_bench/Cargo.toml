[package]
name = "pyx86_bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pyx86-bench"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"
glob = "0.3"
num_cpus = "1"
tempfile = "3"
anyhow = "1"
rand = "0.8"

[lints]
workspace = true
